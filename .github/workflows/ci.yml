# Continuous integration (CI): GitHub runs these checks on every pull request
# and every push to the default branch, so a broken change is caught before it
# is merged. It type-checks the code and confirms the video project can still
# list its compositions. The full video render stays in render.yml.
name: CI

on:
  pull_request:
  push:
    branches: [claude/remotion-debate-intro-video-NN3co]

# If you push to a pull request again while its checks are still running,
# cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
