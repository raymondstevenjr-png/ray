name: Render Video

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx remotion render DebateIntro-Group2 out/DebateIntro-Group2.mp4 --codec=h264
      - uses: actions/upload-artifact@v4
        with:
          name: DebateIntro-Group2
          path: out/DebateIntro-Group2.mp4
